version: '3.8'
services:
  web:
    build: .
    command: ["/app/entrypoint.sh"]
    ports:
      - "80:80"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - PORT=80
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./staticfiles:/app/staticfiles
    restart: unless-stopped
